[package]
name = "mano"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
rig-core = "0.3"          # Multi-model AI agent framework
inquire = "0.7"           # Modern interactive terminal inputs
indicatif = "0.17"        # Terminal spinners
colored = "2.1"           # Terminal colors
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"